<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs><radialGradient id="bg-gc" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#1c1a16"/><stop offset="100%" stop-color="#0a0907"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg-gc)"/>
  <text x="600" y="60" fill="#ffd54f" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">LA GENÈSE D'APRÈS-GUERRE & LA PEUR DE L'ÉPUISEMENT</text>
  <g transform="translate(80, 130)">
    <rect width="480" height="460" rx="16" fill="#241b12" stroke="#e5b026" stroke-width="2"/>
    <text x="240" y="45" fill="#ffd54f" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Les Deux Craintes Historiques</text>
    <rect x="30" y="80" width="420" height="150" rx="10" fill="#332516"/>
    <text x="50" y="115" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold">1. Raréfaction des Produits</text>
    <text x="50" y="145" fill="#dfe6e9" font-family="sans-serif" font-size="13">Crainte de l'épuisement total des écosystèmes</text>
    <text x="50" y="170" fill="#dfe6e9" font-family="sans-serif" font-size="13">de production industrielle face à la demande de masse.</text>
    <rect x="30" y="260" width="420" height="150" rx="10" fill="#332516"/>
    <text x="50" y="295" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold">2. Dégradation Atmosphérique</text>
    <text x="50" y="325" fill="#dfe6e9" font-family="sans-serif" font-size="13">Peur d'une pollution mondiale irréversible</text>
    <text x="50" y="350" fill="#dfe6e9" font-family="sans-serif" font-size="13">générée par la surproduction effrénée.</text>
  </g>
  <g transform="translate(640, 130)">
    <rect width="480" height="460" rx="16" fill="#1a1524" stroke="#9b59b6" stroke-width="2"/>
    <text x="240" y="45" fill="#a29bfe" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">L'Imposition du « Faux Durable »</text>
    <rect x="30" y="80" width="420" height="330" rx="10" fill="#251d36"/>
    <text x="50" y="120" fill="#ffd54f" font-family="sans-serif" font-size="17" font-weight="bold">La Praxis des 3 Piliers Conventionnels</text>
    <text x="50" y="160" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Économique : rentabilité comme seul juge.</text>
    <text x="50" y="195" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Associatif : survie et dons compensatoires.</text>
    <text x="50" y="230" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Environnemental : taxes sur les ménages.</text>
    <line x1="50" y1="260" x2="390" y2="260" stroke="#a29bfe" stroke-width="1"/>
    <text x="50" y="295" fill="#ff7675" font-family="sans-serif" font-size="14" font-weight="bold">Résultat d'un demi-siècle :</text>
    <text x="50" y="325" fill="#fab1a0" font-family="sans-serif" font-size="13">Le pillage écologique s'est accéléré et la</text>
    <text x="50" y="350" fill="#fab1a0" font-family="sans-serif" font-size="13">paupérisation du monde non-occidentalisé a perduré.</text>
  </g>
</svg>