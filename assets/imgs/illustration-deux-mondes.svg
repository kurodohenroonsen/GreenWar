<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dm" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a1410"/><stop offset="100%" stop-color="#162820"/></linearGradient>
    <linearGradient id="glow-w" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#e74c3c" stop-opacity="0.8"/><stop offset="100%" stop-color="#2ed573" stop-opacity="0.8"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-dm)"/>
  <text x="600" y="55" fill="#ffd54f" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">DEUX CIVILISATIONS & DEUX TYPES D'ORGANISATIONS</text>
  <g transform="translate(80, 100)">
    <rect width="480" height="480" rx="16" fill="#1a1010" stroke="#e74c3c" stroke-width="2"/>
    <text x="240" y="45" fill="#ff7675" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Civilisations Non-Occidentalisées</text>
    <rect x="30" y="80" width="420" height="100" rx="10" fill="#2b1515"/>
    <text x="50" y="115" fill="#fab1a0" font-family="sans-serif" font-size="16" font-weight="bold">Zones de Subsistance & Extraction</text>
    <text x="50" y="145" fill="#b2bec3" font-family="sans-serif" font-size="13">Écosystèmes fragilisés par les filières de surproduction externe.</text>
    <rect x="30" y="200" width="420" height="120" rx="10" fill="#2b1515"/>
    <text x="50" y="235" fill="#fab1a0" font-family="sans-serif" font-size="16" font-weight="bold">Les 3 Fléaux Endémiques</text>
    <text x="50" y="265" fill="#ff7675" font-family="sans-serif" font-size="13">• Guerres de ressources • Famines induites • Banditisme</text>
    <text x="50" y="295" fill="#b2bec3" font-family="sans-serif" font-size="13">Ingérence étrangère conditionnée aux seuls intérêts financiers.</text>
    <rect x="30" y="340" width="420" height="100" rx="10" fill="#1c1010"/>
    <text x="50" y="375" fill="#fab1a0" font-family="sans-serif" font-size="15" font-weight="bold">Statut des Populations :</text>
    <text x="50" y="405" fill="#dfe6e9" font-family="sans-serif" font-size="13">Main-d'œuvre à bas coût et extraction primaire sans traçabilité.</text>
  </g>
  <g transform="translate(640, 100)">
    <rect width="480" height="480" rx="16" fill="#0e2219" stroke="#2ed573" stroke-width="2"/>
    <text x="240" y="45" fill="#55efc4" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Civilisations Occidentalisées</text>
    <rect x="30" y="80" width="420" height="100" rx="10" fill="#163628"/>
    <text x="50" y="115" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold">L'Organisation Étatique (195 Nations)</text>
    <text x="50" y="145" fill="#dff9fb" font-family="sans-serif" font-size="13">Système des 3 pouvoirs : Législatif, Exécutif et Judiciaire.</text>
    <rect x="30" y="200" width="420" height="120" rx="10" fill="#163628"/>
    <text x="50" y="235" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold">Les 8 Milliards de Citoyens-Consommateurs</text>
    <text x="50" y="265" fill="#55efc4" font-family="sans-serif" font-size="13">• Seul droit effectif : Acheter comme consommateur</text>
    <text x="50" y="295" fill="#dff9fb" font-family="sans-serif" font-size="13">Contrôlé de l'extérieur par des réseaux marchands opaques.</text>
    <rect x="30" y="340" width="420" height="100" rx="10" fill="#0c1e16"/>
    <text x="50" y="375" fill="#ffd54f" font-family="sans-serif" font-size="15" font-weight="bold">La Rupture GREENWAR :</text>
    <text x="50" y="405" fill="#2ed573" font-family="sans-serif" font-size="13">Faire de l'acte d'achat le vote souverain de la symbiose planétaire.</text>
  </g>
</svg>