<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#e5b026" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Orb -->
  <circle cx="100" cy="100" r="90" fill="#111816" stroke="url(#gw-grad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Outer Symbiosic Orbit -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#2ed573" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  
  <!-- Stylized Green Leaf & Shield of War/Protection -->
  <path d="M100 32 C135 55 160 88 150 135 C142 165 105 178 100 178 C95 178 58 165 50 135 C40 88 65 55 100 32 Z" fill="url(#gw-grad)" opacity="0.95"/>
  
  <!-- Central Symbiosic Tree / Core Vector -->
  <path d="M100 45 L100 162" stroke="#111816" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 80 Q125 70 132 95 Q115 105 100 100" fill="#111816"/>
  <path d="M100 105 Q75 95 68 120 Q85 130 100 125" fill="#111816"/>
  <path d="M100 125 Q125 118 128 140 Q112 148 100 142" fill="#111816"/>
  
  <!-- Glowing Crown Star -->
  <polygon points="100,20 105,32 118,34 108,43 111,56 100,48 89,56 92,43 82,34 95,32" fill="#ffd54f" filter="url(#glow)"/>
</svg>
