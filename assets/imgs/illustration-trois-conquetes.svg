<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dark-triad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="50%" stop-color="#111816"/>
      <stop offset="100%" stop-color="#08120e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dark-triad)"/>
  <text x="600" y="70" fill="#ff7675" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">LES 3 CONQUÊTES DU « DÉVELOPPEMENT DURABLE » ACTUEL</text>
  <text x="600" y="105" fill="#b2bec3" font-family="sans-serif" font-size="16" text-anchor="middle">Comment les 3 piliers conventionnels légitiment le pillage écologique de bon droit</text>
  
  <!-- Conquest 1: L'ARGENT -->
  <g transform="translate(100, 150)">
    <rect width="300" height="440" rx="16" fill="#231515" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="150" cy="80" r="45" fill="#3d1a1a" stroke="#ff7675" stroke-width="2"/>
    <text x="150" y="92" fill="#ffd54f" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="middle">$</text>
    <text x="150" y="160" fill="#fab1a0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1. L'ARGENT</text>
    <text x="150" y="190" fill="#e5b026" font-family="sans-serif" font-size="15" text-anchor="middle">Pilier Économique</text>
    <path d="M30 220 L270 220" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="150" y="255" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Rentabilité aveugle comme</text>
    <text x="150" y="280" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">unique finalité légitime.</text>
    <text x="150" y="315" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Main-d'œuvre à bas coût</text>
    <text x="150" y="340" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">et cadences destructrices.</text>
    <text x="150" y="375" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• L'écologie traitée comme</text>
    <text x="150" y="400" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">simple argument concurrentiel.</text>
  </g>

  <!-- Conquest 2: LE POUVOIR -->
  <g transform="translate(450, 150)">
    <rect width="300" height="440" rx="16" fill="#1c1a24" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="150" cy="80" r="45" fill="#2d1b3d" stroke="#a29bfe" stroke-width="2"/>
    <polygon points="150,55 160,75 180,75 165,90 170,110 150,95 130,110 135,90 120,75 140,75" fill="#a29bfe"/>
    <text x="150" y="160" fill="#dcdde1" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">2. LE POUVOIR</text>
    <text x="150" y="190" fill="#a29bfe" font-family="sans-serif" font-size="15" text-anchor="middle">Pilier Environnemental</text>
    <path d="M30 220 L270 220" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="150" y="255" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Dépense de crédits et</text>
    <text x="150" y="280" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">justification bureaucratique.</text>
    <text x="150" y="315" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Lois votées selon l'intérêt</text>
    <text x="150" y="340" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">politique et électoraliste.</text>
    <text x="150" y="375" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Report fiscal systématique</text>
    <text x="150" y="400" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">sur le Citoyen-Consommateur.</text>
  </g>

  <!-- Conquest 3: LA GLOIRE -->
  <g transform="translate(800, 150)">
    <rect width="300" height="440" rx="16" fill="#16231d" stroke="#2ed573" stroke-width="2"/>
    <circle cx="150" cy="80" r="45" fill="#1b3b2d" stroke="#55efc4" stroke-width="2"/>
    <path d="M130 95 L145 110 L175 75" stroke="#55efc4" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="160" fill="#55efc4" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">3. LA GLOIRE</text>
    <text x="150" y="190" fill="#2ed573" font-family="sans-serif" font-size="15" text-anchor="middle">Pilier Associatif</text>
    <path d="M30 220 L270 220" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="150" y="255" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Survie et renom de l'organisme</text>
    <text x="150" y="280" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">comme buts prioritaires.</text>
    <text x="150" y="315" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Financement ponctionné sur</text>
    <text x="150" y="340" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">les entreprises polluantes.</text>
    <text x="150" y="375" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">• Réparation sporadique d'un</text>
    <text x="150" y="400" fill="#dfe6e9" font-family="sans-serif" font-size="14" text-anchor="middle">tissu social fragmenté.</text>
  </g>
</svg>