    <rect x="25" y="190" width="270" height="230" rx="10" fill="#0d1914"/>
    <text x="40" y="230" fill="#dff9fb" font-family="sans-serif" font-size="13">• Recyclage organique en 72h.</text>
    <text x="40" y="260" fill="#dff9fb" font-family="sans-serif" font-size="13">• Dégradation sans méthane.</text>
    <text x="40" y="290" fill="#dff9fb" font-family="sans-serif" font-size="13">• Zéro empreinte carbone.</text>
    <text x="40" y="330" fill="#2ed573" font-family="sans-serif" font-size="13" font-weight="bold">→ Zéro Déchet</text>
  </g>
  <g transform="translate(440, 130)">
