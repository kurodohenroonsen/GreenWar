    <path d="M140 90 L160 60 L180 90 Z" fill="#2ed573"/>
    <text x="160" y="160" fill="#ffd54f" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2. Protéines & Frass</text>
    <rect x="25" y="190" width="270" height="230" rx="10" fill="#0d1914"/>
    <text x="40" y="230" fill="#dff9fb" font-family="sans-serif" font-size="13">• Protéines d'insectes riches.</text>
    <text x="40" y="260" fill="#dff9fb" font-family="sans-serif" font-size="13">• Frass bio-fertilisant vivant.</text>
    <text x="40" y="290" fill="#dff9fb" font-family="sans-serif" font-size="13">• Régénération des sols agricoles.</text>
    <text x="40" y="330" fill="#ffd54f" font-family="sans-serif" font-size="13" font-weight="bold">→ Valeur Maximale</text>
