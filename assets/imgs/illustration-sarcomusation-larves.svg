    <circle cx="160" cy="80" r="45" fill="#301515" stroke="#ff7675" stroke-width="2"/>
    <path d="M145 65 L175 95 M175 65 L145 95" stroke="#ff7675" stroke-width="4"/>
    <text x="160" y="160" fill="#ff7675" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">3. Règle Anti-Prion</text>
    <rect x="25" y="190" width="270" height="230" rx="10" fill="#0d1914"/>
    <text x="40" y="230" fill="#dff9fb" font-family="sans-serif" font-size="13">• Zéro recyclage intra-espèce.</text>
    <text x="40" y="260" fill="#dff9fb" font-family="sans-serif" font-size="13">• Stérilisation Méthode 1.</text>
    <text x="40" y="290" fill="#dff9fb" font-family="sans-serif" font-size="13">• Signature Ed25519 infalsifiable.</text>
    <text x="40" y="330" fill="#ff7675" font-family="sans-serif" font-size="13" font-weight="bold">→ Sécurité Absolue</text>
