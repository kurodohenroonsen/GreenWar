<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs><radialGradient id="bg-sl" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#11291f"/><stop offset="100%" stop-color="#08120e"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg-sl)"/>
  <text x="600" y="60" fill="#2ed573" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">BIODÉGRADATION TOTALE & SARCOMUSATION (HERMETIA ILLUCENS)</text>
  <g transform="translate(80, 130)">
    <rect width="320" height="460" rx="16" fill="#162a22" stroke="#2ed573" stroke-width="2"/>
