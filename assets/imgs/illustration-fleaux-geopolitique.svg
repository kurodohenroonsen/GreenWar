<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dual-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0d0d"/>
      <stop offset="48%" stop-color="#2e1515"/>
      <stop offset="52%" stop-color="#0e261d"/>
      <stop offset="100%" stop-color="#091b14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dual-grad)"/>
  <!-- Divider -->
  <line x1="600" y1="40" x2="600" y2="635" stroke="#e5b026" stroke-width="3" stroke-dasharray="8,6" opacity="0.6"/>
  <!-- Left: The 3 Human Plagues (Guerre, Famine, Banditisme) -->
  <g transform="translate(50, 80)">
    <rect width="480" height="480" rx="16" fill="rgba(30,15,15,0.7)" stroke="#e74c3c" stroke-width="2"/>
    <text x="240" y="50" fill="#ff7675" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">PAYS DU MONDE NON-OCCIDENTALISÉ</text>
    <text x="240" y="85" fill="#d63031" font-family="sans-serif" font-size="16" text-anchor="middle">Les 3 Fléaux Humains & Pillage Écologique</text>
    
    <!-- Plague 1: Guerre -->
    <rect x="40" y="120" width="400" height="85" rx="10" fill="#2d1515" stroke="#e74c3c" stroke-width="1"/>
    <text x="70" y="155" fill="#fab1a0" font-family="sans-serif" font-size="18" font-weight="bold">1. LA GUERRE</text>
    <text x="70" y="182" fill="#b2bec3" font-family="sans-serif" font-size="13">Conflits géopolitiques, extraction forcée des ressources</text>
    
    <!-- Plague 2: Famine -->
    <rect x="40" y="225" width="400" height="85" rx="10" fill="#2d1515" stroke="#e74c3c" stroke-width="1"/>
    <text x="70" y="260" fill="#fab1a0" font-family="sans-serif" font-size="18" font-weight="bold">2. LA FAMINE</text>
    <text x="70" y="287" fill="#b2bec3" font-family="sans-serif" font-size="13">Épuisement des terres nourricières, exportations de survie</text>
    
    <!-- Plague 3: Banditisme -->
    <rect x="40" y="330" width="400" height="85" rx="10" fill="#2d1515" stroke="#e74c3c" stroke-width="1"/>
    <text x="70" y="365" fill="#fab1a0" font-family="sans-serif" font-size="18" font-weight="bold">3. LE BANDITISME</text>
    <text x="70" y="392" fill="#b2bec3" font-family="sans-serif" font-size="13">Corruption systémique et réseaux de prédation illégale</text>
    
    <text x="240" y="450" fill="#e17055" font-family="sans-serif" font-size="14" font-style="italic" text-anchor="middle">Ingérence votée uniquement si les intérêts financiers sont en péril</text>
  </g>
  
  <!-- Right: The 195 Nations & 8 Billion Consumer-Citizens -->
  <g transform="translate(670, 80)">
    <rect width="480" height="480" rx="16" fill="rgba(15,35,25,0.7)" stroke="#2ed573" stroke-width="2"/>
    <text x="240" y="50" fill="#55efc4" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">L'ORGANISATION ÉTATIQUE & CITOYENNE</text>
    <text x="240" y="85" fill="#2ed573" font-family="sans-serif" font-size="16" text-anchor="middle">195 Nations & 8 Milliards de Citoyens-Consommateurs</text>
    
    <!-- Box 1 -->
    <rect x="40" y="120" width="400" height="85" rx="10" fill="#132e22" stroke="#2ed573" stroke-width="1"/>
    <text x="70" y="155" fill="#a8e6cf" font-family="sans-serif" font-size="18" font-weight="bold">LES 3 POUVOIRS CLASSIQUES</text>
    <text x="70" y="182" fill="#dff9fb" font-family="sans-serif" font-size="13">Législatif, Exécutif, Judiciaire — Gestion de la territorialité</text>
    
    <!-- Box 2 -->
    <rect x="40" y="225" width="400" height="85" rx="10" fill="#132e22" stroke="#2ed573" stroke-width="1"/>
    <text x="70" y="260" fill="#a8e6cf" font-family="sans-serif" font-size="18" font-weight="bold">LES 3 CONQUÊTES DU SYSTÈME</text>
    <text x="70" y="287" fill="#dff9fb" font-family="sans-serif" font-size="13">Argent, Pouvoir, Gloire — Ravage de la planète de bon droit</text>
    
    <!-- Box 3 -->
    <rect x="40" y="330" width="400" height="85" rx="10" fill="#132e22" stroke="#ffd54f" stroke-width="1"/>
    <text x="70" y="365" fill="#ffd54f" font-family="sans-serif" font-size="18" font-weight="bold">LE LEVIER GREENWAR</text>
    <text x="70" y="392" fill="#dff9fb" font-family="sans-serif" font-size="13">Transformer le seul droit d'acheter en contre-pouvoir souverain</text>
    
    <text x="240" y="450" fill="#ffd54f" font-family="sans-serif" font-size="14" font-style="italic" text-anchor="middle">Rétablir l'équilibre universel des 4 piliers de vie</text>
  </g>
</svg>