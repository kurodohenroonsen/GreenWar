<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs><radialGradient id="bg-tc" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0e221b"/><stop offset="100%" stop-color="#050e0a"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg-tc)"/>
  <text x="600" y="60" fill="#ffd54f" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">TRAÇABILITÉ P2P CRYPTOGRAPHIQUE AETERNITRAK (ED25519)</text>
  <g transform="translate(150, 130)">
    <rect width="900" height="460" rx="16" fill="#11251e" stroke="#2ed573" stroke-width="2"/>
    <!-- 4 Step Nodes -->
    <g transform="translate(50, 60)">
      <circle cx="80" cy="80" r="45" fill="#1a3d30" stroke="#ffd54f" stroke-width="2"/>
      <text x="80" y="88" fill="#ffd54f" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">NFC</text>
      <text x="80" y="160" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">1. Collecte Badge</text>
      <text x="80" y="185" fill="#a3b0a9" font-family="sans-serif" font-size="12" text-anchor="middle">GPS & Identifiant</text>
    </g>
    <line x1="180" y1="140" x2="240" y2="140" stroke="#2ed573" stroke-width="3" stroke-dasharray="6,4"/>
    <g transform="translate(250, 60)">
      <circle cx="80" cy="80" r="45" fill="#1a3d30" stroke="#2ed573" stroke-width="2"/>
      <text x="80" y="88" fill="#2ed573" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LFA</text>
      <text x="80" y="160" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">2. Dépistage LFA/PCR</text>
      <text x="80" y="185" fill="#a3b0a9" font-family="sans-serif" font-size="12" text-anchor="middle">Pentobarbital / Prions</text>
    </g>
    <line x1="380" y1="140" x2="440" y2="140" stroke="#2ed573" stroke-width="3" stroke-dasharray="6,4"/>
    <g transform="translate(450, 60)">
      <circle cx="80" cy="80" r="45" fill="#1a3d30" stroke="#ffd54f" stroke-width="2"/>
      <text x="80" y="88" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">133°C</text>
      <text x="80" y="160" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">3. Stérilisation M1</text>
      <text x="80" y="185" fill="#a3b0a9" font-family="sans-serif" font-size="12" text-anchor="middle">3 bars - 20 minutes</text>
    </g>
    <line x1="580" y1="140" x2="640" y2="140" stroke="#2ed573" stroke-width="3" stroke-dasharray="6,4"/>
    <g transform="translate(650, 60)">
      <circle cx="80" cy="80" r="45" fill="#1a3d30" stroke="#2ed573" stroke-width="2"/>
      <text x="80" y="88" fill="#2ed573" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ed25519</text>
      <text x="80" y="160" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">4. Sceau Blockchain</text>
      <text x="80" y="185" fill="#a3b0a9" font-family="sans-serif" font-size="12" text-anchor="middle">Preuve Inaltérable</text>
    </g>
    <rect x="50" y="290" width="800" height="120" rx="10" fill="#0c1a15" stroke="#ffd54f" stroke-width="1"/>
    <text x="450" y="330" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CONTRÔLE CITOYEN DIRECT SUR SMARTPHONE</text>
    <text x="450" y="360" fill="#dff9fb" font-family="sans-serif" font-size="13" text-anchor="middle">Chaque consommateur scanne le QR/NFC d'un produit et audite en 1 seconde l'historique biologique complet.</text>
    <text x="450" y="385" fill="#2ed573" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Impossibilité absolue de falsification ou de greenwashing.</text>
