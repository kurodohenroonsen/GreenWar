<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-piliers" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#132520"/>
      <stop offset="100%" stop-color="#08120e"/>
    </radialGradient>
    <linearGradient id="pillar-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#e5b026"/>
      <stop offset="100%" stop-color="#b28919"/>
    </linearGradient>
    <linearGradient id="pillar-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-piliers)"/>
  
  <text x="600" y="60" fill="#ffd54f" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="3">LES 4 NOUVEAUX PILIERS & LES 4 POUVOIRS SYMBIOSIQUES</text>
  <text x="600" y="95" fill="#a3b0a9" font-family="sans-serif" font-size="16" text-anchor="middle">L'équilibre universel au service des 8 milliards de Citoyens-Consommateurs</text>
  
  <!-- 4 Pillars of Society -->
  <!-- 1. FAMILIAL -->
  <g transform="translate(80, 130)">
    <rect width="240" height="360" rx="14" fill="#172a24" stroke="url(#pillar-green)" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="44" rx="8" fill="#10b981"/>
    <text x="120" y="48" fill="#081410" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">1. FAMILIAL</text>
    <circle cx="120" cy="120" r="35" fill="#1e3d33" stroke="#2ed573" stroke-width="2"/>
    <path d="M120 100 Q130 90 140 105 Q120 135 120 140 Q120 135 100 105 Q110 90 120 100 Z" fill="#ffd54f"/>
    <text x="120" y="190" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Socle de la Vie</text>
    <text x="120" y="220" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">Éducation, transmission</text>
    <text x="120" y="240" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">et dignité humaine.</text>
    <rect x="20" y="290" width="200" height="50" rx="8" fill="#0e1f1a"/>
    <text x="120" y="320" fill="#2ed573" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pouvoir Exécutif Citoyen</text>
  </g>
  
  <!-- 2. ASSOCIATIF -->
  <g transform="translate(350, 130)">
    <rect width="240" height="360" rx="14" fill="#172a24" stroke="url(#pillar-gold)" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="44" rx="8" fill="#e5b026"/>
    <text x="120" y="48" fill="#081410" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2. ASSOCIATIF</text>
    <circle cx="120" cy="120" r="35" fill="#1e3d33" stroke="#ffd54f" stroke-width="2"/>
    <path d="M105 120 L135 120 M120 105 L120 135" stroke="#ffd54f" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="190" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Contre-Pouvoir Éthique</text>
    <text x="120" y="220" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">Solidarité réelle, audits</text>
    <text x="120" y="240" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">et actions altruistes.</text>
    <rect x="20" y="290" width="200" height="50" rx="8" fill="#0e1f1a"/>
    <text x="120" y="320" fill="#ffd54f" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pouvoir Législatif Éthique</text>
  </g>
  
  <!-- 3. ENTREPRENEURIAL -->
  <g transform="translate(620, 130)">
    <rect width="240" height="360" rx="14" fill="#172a24" stroke="url(#pillar-green)" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="44" rx="8" fill="#10b981"/>
    <text x="120" y="48" fill="#081410" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">3. ENTREPRENEURIAL</text>
    <circle cx="120" cy="120" r="35" fill="#1e3d33" stroke="#2ed573" stroke-width="2"/>
    <polygon points="120,95 135,120 105,120" fill="#2ed573"/>
    <text x="120" y="190" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Création Symbiosique</text>
    <text x="120" y="220" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">Produire en bonifiant</text>
    <text x="120" y="240" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">les écosystèmes réels.</text>
    <rect x="20" y="290" width="200" height="50" rx="8" fill="#0e1f1a"/>
    <text x="120" y="320" fill="#2ed573" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pouvoir Judiciaire de Marché</text>
  </g>
  
  <!-- 4. ÉTATIQUE -->
  <g transform="translate(890, 130)">
    <rect width="240" height="360" rx="14" fill="#172a24" stroke="url(#pillar-gold)" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="44" rx="8" fill="#e5b026"/>
    <text x="120" y="48" fill="#081410" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">4. ÉTATIQUE</text>
    <circle cx="120" cy="120" r="35" fill="#1e3d33" stroke="#ffd54f" stroke-width="2"/>
    <path d="M100 135 L120 105 L140 135 Z" fill="#ffd54f"/>
    <text x="120" y="190" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Garant Souverain</text>
    <text x="120" y="220" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">Règle commune équitable</text>
    <text x="120" y="240" fill="#a3b0a9" font-family="sans-serif" font-size="13" text-anchor="middle">sans report fiscal abusif.</text>
    <rect x="20" y="290" width="200" height="50" rx="8" fill="#0e1f1a"/>
    <text x="120" y="320" fill="#ffd54f" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pouvoir Médiatique Libre</text>
  </g>
  
  <!-- Bottom Quote Banner -->
  <rect x="150" y="530" width="900" height="90" rx="16" fill="#0e1e19" stroke="#e5b026" stroke-width="1.5"/>
  <text x="600" y="565" fill="#ffd54f" font-family="serif" font-size="19" font-style="italic" text-anchor="middle">"À ceux qui pensent ce qu’ils disent, disent ce qu’ils pensent, et font ce qu’ils disent."</text>
  <text x="600" y="595" fill="#2ed573" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">— FONDATION ASBL GREENWAR —</text>
</svg>