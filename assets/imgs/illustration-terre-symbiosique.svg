<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d231a"/>
      <stop offset="50%" stop-color="#081410"/>
      <stop offset="100%" stop-color="#040a08"/>
    </radialGradient>
    <linearGradient id="earth-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#e5b026"/>
    </linearGradient>
    <linearGradient id="gold-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2ed573" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#space-bg)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/><circle cx="240" cy="150" r="1"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1050" cy="200" r="1"/><circle cx="150" cy="500" r="1.2"/><circle cx="1080" cy="480" r="1.8"/>
    <circle cx="600" cy="50" r="1"/><circle cx="450" cy="120" r="1.5"/><circle cx="780" cy="90" r="1.2"/>
  </g>
  <!-- Atmospheric Glow -->
  <circle cx="600" cy="337" r="240" fill="#10b981" opacity="0.15" filter="url(#glow-effect)"/>
  <circle cx="600" cy="337" r="210" fill="url(#earth-glow)" filter="url(#glow-effect)"/>
  <circle cx="600" cy="337" r="200" fill="#064e3b"/>
  <!-- Continents & Green Networks -->
  <path d="M470 280 Q520 220 580 250 Q620 280 600 340 Q550 380 490 350 Z" fill="#2ed573" opacity="0.85"/>
  <path d="M630 260 Q690 230 730 290 Q710 360 650 340 Z" fill="#10b981" opacity="0.85"/>
  <path d="M510 370 Q560 410 610 400 Q630 450 570 470 Q520 440 510 370 Z" fill="#2ed573" opacity="0.8"/>
  <!-- Symbiosic Network Nodes & Circuits -->
  <g stroke="#ffd54f" stroke-width="2" opacity="0.7" fill="none">
    <path d="M480 300 L540 280 L590 310 L660 270 L710 320" stroke-dasharray="4,4"/>
    <path d="M540 280 L570 410 L660 330" stroke-dasharray="4,4"/>
    <circle cx="480" cy="300" r="5" fill="#ffd54f"/>
    <circle cx="540" cy="280" r="6" fill="#2ed573"/>
    <circle cx="590" cy="310" r="5" fill="#ffd54f"/>
    <circle cx="660" cy="270" r="6" fill="#2ed573"/>
    <circle cx="710" cy="320" r="5" fill="#ffd54f"/>
    <circle cx="570" cy="410" r="6" fill="#2ed573"/>
  </g>
  <!-- Orbit Ring -->
  <ellipse cx="600" cy="337" rx="360" ry="130" fill="none" stroke="url(#earth-glow)" stroke-width="3" stroke-dasharray="12,8" transform="rotate(-15 600 337)"/>
  <!-- Light Rays -->
  <polygon points="600,337 1100,50 1150,120" fill="url(#gold-beam)"/>
  <!-- Label Overlay -->
  <rect x="350" y="580" width="500" height="48" rx="24" fill="rgba(17,24,22,0.85)" stroke="#e5b026" stroke-width="1.5"/>
  <text x="600" y="610" fill="#ffd54f" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">510.065.000 KM² — DÉVELOPPEMENT SYMBIOSIQUE</text>
</svg>