<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081812"/>
      <stop offset="50%" stop-color="#11291f"/>
      <stop offset="100%" stop-color="#06130e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bio-bg)"/>
  <text x="600" y="60" fill="#2ed573" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">L'ÉCONOMIE SYMBIOSIQUE EN ACTION</text>
  <text x="600" y="95" fill="#ffd54f" font-family="sans-serif" font-size="16" text-anchor="middle">Produire de la valeur suprême en bonifiant 100% des écosystèmes naturels</text>
  
  <!-- 3 Circular Bio-Tech Modules -->
  <!-- 1. BIODÉGRADATION & SARCOMUSATION -->
  <g transform="translate(80, 140)">
    <rect width="320" height="440" rx="16" fill="#14241d" stroke="#10b981" stroke-width="2"/>
    <circle cx="160" cy="80" r="45" fill="#1f3d2f" stroke="#2ed573" stroke-width="2"/>
    <path d="M140 80 Q160 55 180 80 Q160 105 140 80 Z" fill="#ffd54f"/>
    <text x="160" y="160" fill="#2ed573" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle">1. BIODÉGRADATION</text>
    <text x="160" y="185" fill="#ffd54f" font-family="sans-serif" font-size="14" text-anchor="middle">Cycle Hermetia Illucens</text>
    <rect x="25" y="210" width="270" height="200" rx="10" fill="#0d1914"/>
    <text x="40" y="245" fill="#dff9fb" font-family="sans-serif" font-size="13">• Recyclage biologique intégral.</text>
    <text x="40" y="275" fill="#dff9fb" font-family="sans-serif" font-size="13">• Zéro déchet, zéro incinération polluante.</text>
    <text x="40" y="305" fill="#dff9fb" font-family="sans-serif" font-size="13">• Transformation en protéines & frass riche.</text>
    <text x="40" y="335" fill="#dff9fb" font-family="sans-serif" font-size="13">• Traçabilité stricte anti-prion.</text>
    <text x="40" y="375" fill="#2ed573" font-family="sans-serif" font-size="13" font-weight="bold">→ Régénération des terres</text>
  </g>

  <!-- 2. AGRO-ÉCOLOGIE ET BIO-FERTILISANTS -->
  <g transform="translate(440, 140)">
    <rect width="320" height="440" rx="16" fill="#14241d" stroke="#e5b026" stroke-width="2"/>
    <circle cx="160" cy="80" r="45" fill="#1f3d2f" stroke="#ffd54f" stroke-width="2"/>
    <path d="M160 55 L160 105 M140 75 Q160 60 180 75" stroke="#2ed573" stroke-width="3" fill="none"/>
    <text x="160" y="160" fill="#ffd54f" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle">2. BIO-FERTILISATION</text>
    <text x="160" y="185" fill="#2ed573" font-family="sans-serif" font-size="14" text-anchor="middle">Restauration des Sols Vivants</text>
    <rect x="25" y="210" width="270" height="200" rx="10" fill="#0d1914"/>
    <text x="40" y="245" fill="#dff9fb" font-family="sans-serif" font-size="13">• Amélioration microbiologique des sols.</text>
    <text x="40" y="275" fill="#dff9fb" font-family="sans-serif" font-size="13">• Fin des engrais pétrochimiques toxiques.</text>
    <text x="40" y="305" fill="#dff9fb" font-family="sans-serif" font-size="13">• Séquestration massive du carbone.</text>
    <text x="40" y="335" fill="#dff9fb" font-family="sans-serif" font-size="13">• Rendements agricoles décuplés.</text>
    <text x="40" y="375" fill="#ffd54f" font-family="sans-serif" font-size="13" font-weight="bold">→ Souveraineté alimentaire</text>
  </g>

  <!-- 3. TRAÇABILITÉ SOUVERAINE -->
  <g transform="translate(800, 140)">
    <rect width="320" height="440" rx="16" fill="#14241d" stroke="#2ed573" stroke-width="2"/>
    <circle cx="160" cy="80" r="45" fill="#1f3d2f" stroke="#2ed573" stroke-width="2"/>
    <rect x="145" y="65" width="30" height="30" rx="4" fill="#ffd54f"/>
    <text x="160" y="160" fill="#2ed573" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle">3. TRAÇABILITÉ P2P</text>
    <text x="160" y="185" fill="#ffd54f" font-family="sans-serif" font-size="14" text-anchor="middle">Certification Cryptographique</text>
    <rect x="25" y="210" width="270" height="200" rx="10" fill="#0d1914"/>
    <text x="40" y="245" fill="#dff9fb" font-family="sans-serif" font-size="13">• Signatures Ed25519 infalsifiables.</text>
    <text x="40" y="275" fill="#dff9fb" font-family="sans-serif" font-size="13">• Audit citoyen décentralisé.</text>
    <text x="40" y="305" fill="#dff9fb" font-family="sans-serif" font-size="13">• Transparence totale de la chaîne de valeur.</text>
    <text x="40" y="335" fill="#dff9fb" font-family="sans-serif" font-size="13">• Sanction immédiate du greenwashing.</text>
    <text x="40" y="375" fill="#2ed573" font-family="sans-serif" font-size="13" font-weight="bold">→ Confiance inaltérable</text>
  </g>
</svg>