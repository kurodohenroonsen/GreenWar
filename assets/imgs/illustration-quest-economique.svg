<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs><radialGradient id="bg-qe" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#11291f"/><stop offset="100%" stop-color="#08120e"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg-qe)"/>
  <text x="600" y="65" fill="#ffd54f" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">L'ABSOLUE QUÊTE ÉCONOMIQUE SYMBIOSIQUE</text>
  <circle cx="600" cy="350" r="180" fill="#0d2219" stroke="#2ed573" stroke-width="4"/>
  <circle cx="600" cy="350" r="140" fill="#163829" stroke="#ffd54f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="310" fill="#2ed573" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">PRODUIRE EN BONIFIANT</text>
  <text x="600" y="345" fill="#ffffff" font-family="serif" font-size="16" text-anchor="middle">Les 510.065.000 km² de la Terre</text>
  <text x="600" y="385" fill="#ffd54f" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RÉGÉNÉRATION MAXIMALE</text>
  <g transform="translate(100, 180)">
    <rect width="280" height="140" rx="12" fill="#152a21" stroke="#2ed573" stroke-width="1.5"/>
    <text x="20" y="40" fill="#2ed573" font-family="sans-serif" font-size="16" font-weight="bold">1. Zéro Exploitation</text>
    <text x="20" y="70" fill="#dff9fb" font-family="sans-serif" font-size="13">Fin des filières opaques</text>
    <text x="20" y="95" fill="#a8e6cf" font-family="sans-serif" font-size="13">et du travail indigne.</text>
  </g>
  <g transform="translate(100, 360)">
    <rect width="280" height="140" rx="12" fill="#152a21" stroke="#2ed573" stroke-width="1.5"/>
    <text x="20" y="40" fill="#2ed573" font-family="sans-serif" font-size="16" font-weight="bold">2. Profit Éco-Aligné</text>
    <text x="20" y="70" fill="#dff9fb" font-family="sans-serif" font-size="13">Les gains financiers réservés</text>
    <text x="20" y="95" fill="#a8e6cf" font-family="sans-serif" font-size="13">à ceux qui restaurent le vivant.</text>
  </g>
  <g transform="translate(820, 180)">
    <rect width="280" height="140" rx="12" fill="#152a21" stroke="#ffd54f" stroke-width="1.5"/>
    <text x="20" y="40" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold">3. Boucles Fermées</text>
    <text x="20" y="70" fill="#dff9fb" font-family="sans-serif" font-size="13">Biotechnologie circulaire,</text>
    <text x="20" y="95" fill="#ffd54f" font-family="sans-serif" font-size="13">zéro déchet, zéro pollution.</text>
  </g>
  <g transform="translate(820, 360)">
    <rect width="280" height="140" rx="12" fill="#152a21" stroke="#ffd54f" stroke-width="1.5"/>
    <text x="20" y="40" fill="#ffd54f" font-family="sans-serif" font-size="16" font-weight="bold">4. Transparence P2P</text>
    <text x="20" y="70" fill="#dff9fb" font-family="sans-serif" font-size="13">Audit citoyen décentralisé</text>
    <text x="20" y="95" fill="#ffd54f" font-family="sans-serif" font-size="13">sans greenwashing possible.</text>
  </g>
</svg>