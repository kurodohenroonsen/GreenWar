<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs><radialGradient id="bg-tf" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#221111"/><stop offset="100%" stop-color="#0d0505"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg-tf)"/>
  <text x="600" y="60" fill="#ff7675" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">LES 3 FLÉAUX HUMAINS ENDÉMIQUES</text>
  <text x="600" y="95" fill="#b2bec3" font-family="sans-serif" font-size="16" text-anchor="middle">L'ingérence politique n'intervient que lorsque les intérêts financiers sont menacés</text>
  <g transform="translate(80, 140)">
    <rect width="320" height="440" rx="16" fill="#301515" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="160" cy="80" r="45" fill="#4d1d1d" stroke="#ff7675" stroke-width="2"/>
    <polygon points="160,50 175,70 200,70 180,85 185,110 160,95 135,110 140,85 120,70 145,70" fill="#e74c3c"/>
    <text x="160" y="160" fill="#fab1a0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1. LA GUERRE</text>
    <rect x="25" y="190" width="270" height="220" rx="10" fill="#1f0d0d"/>
    <text x="40" y="230" fill="#ff7675" font-family="sans-serif" font-size="14" font-weight="bold">Causes Systémiques :</text>
    <text x="40" y="260" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Conflits géopolitiques armés.</text>
    <text x="40" y="290" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Prédation des minerais rares.</text>
    <text x="40" y="320" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Déstabilisation des États fragiles.</text>
    <text x="40" y="360" fill="#e17055" font-family="sans-serif" font-size="13" font-style="italic">« Pillage institutionnalisé »</text>
  </g>
  <g transform="translate(440, 140)">
    <rect width="320" height="440" rx="16" fill="#301515" stroke="#e67e22" stroke-width="2"/>
    <circle cx="160" cy="80" r="45" fill="#4d291d" stroke="#f39c12" stroke-width="2"/>
    <path d="M160 50 Q170 80 160 110 M145 75 Q160 65 175 75 M145 95 Q160 85 175 95" stroke="#f39c12" stroke-width="3" fill="none"/>
    <text x="160" y="160" fill="#f39c12" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">2. LA FAMINE</text>
    <rect x="25" y="190" width="270" height="220" rx="10" fill="#1f0d0d"/>
    <text x="40" y="230" fill="#f39c12" font-family="sans-serif" font-size="14" font-weight="bold">Causes Systémiques :</text>
    <text x="40" y="260" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Monocultures d'exportation.</text>
    <text x="40" y="290" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Sols lessivés aux pesticides.</text>
    <text x="40" y="320" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Spéculation sur les céréales.</text>
    <text x="40" y="360" fill="#f39c12" font-family="sans-serif" font-size="13" font-style="italic">« Ruine de la souveraineté »</text>
  </g>
  <g transform="translate(800, 140)">
    <rect width="320" height="440" rx="16" fill="#301515" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="160" cy="80" r="45" fill="#3a1d4d" stroke="#a29bfe" stroke-width="2"/>
    <path d="M140 75 L180 75 L180 100 L140 100 Z M150 75 L150 60 Q160 50 170 60 L170 75" stroke="#a29bfe" stroke-width="3" fill="none"/>
    <text x="160" y="160" fill="#a29bfe" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">3. LE BANDITISME</text>
    <rect x="25" y="190" width="270" height="220" rx="10" fill="#1f0d0d"/>
    <text x="40" y="230" fill="#a29bfe" font-family="sans-serif" font-size="14" font-weight="bold">Causes Systémiques :</text>
    <text x="40" y="260" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Réseaux mafieux d'extraction.</text>
    <text x="40" y="290" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Corruption transfrontalière.</text>
    <text x="40" y="320" fill="#dfe6e9" font-family="sans-serif" font-size="13">• Travail forcé clandestin.</text>
    <text x="40" y="360" fill="#a29bfe" font-family="sans-serif" font-size="13" font-style="italic">« Absence d'État de droit »</text>
  </g>
</svg>